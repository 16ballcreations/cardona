<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cardona">
  <!-- Tres losas apiladas, cada una con su línea de luz debajo. -->
  <defs>
    <filter id="brillo" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" fill="#090900"/>
  <rect x="10" y="14" width="44" height="6" fill="#373638"/>
  <rect x="10" y="21" width="44" height="1.2" fill="#D7B399" filter="url(#brillo)"/>
  <rect x="14" y="29" width="40" height="6" fill="#373638"/>
  <rect x="14" y="36" width="40" height="1.2" fill="#D7B399" filter="url(#brillo)"/>
  <rect x="10" y="44" width="44" height="6" fill="#373638"/>
  <rect x="10" y="51" width="44" height="1.2" fill="#D7B399" filter="url(#brillo)"/>
</svg>
